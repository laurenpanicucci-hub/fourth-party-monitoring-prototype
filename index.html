<meta charset="utf-8">
<title>Third Party Risk Agent</title>
<style>
:root{
 --n0:#fff;--n50:hsl(0 0% 97%);--n100:hsl(0 0% 93%);--n200:hsl(0 0% 90%);--n300:hsl(0 0% 84%);
 --n400:hsl(0 0% 66%);--n500:hsl(0 0% 46%);--n600:hsl(0 0% 37%);--n700:hsl(0 0% 29%);
 --n800:hsl(0 0% 18%);--n900:hsl(0 0% 10%);
 --r-md:4px;--r-lg:6px;--r-xl:12px;--sh:0 1px 2px 0 rgb(0 0 0/.05);
 --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--n50);color:var(--n900);font-family:var(--sans);font-size:14px;line-height:1.5;
 -webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01';overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.app{display:flex;flex-direction:column;height:100vh}
.row{display:flex;flex:1;min-height:0}
/* banner */
.banner{display:none;align-items:center;gap:10px;padding:9px 20px;border-bottom:1px solid var(--n900);
 background:var(--n900);color:#fff;font-size:13px}
.banner.on{display:flex}
.banner .ic{width:16px;height:16px;border-radius:99px;border:1.5px solid #fff;display:inline-flex;align-items:center;
 justify-content:center;font-size:10px;font-weight:700;flex:0 0 auto}
.banner a{color:#fff;font-weight:600;text-decoration:none;cursor:pointer;margin-left:2px;display:inline-flex;align-items:center;gap:4px}
.banner a .arr{transition:transform .12s;display:inline-block}
.banner a:hover .arr{transform:translateX(3px)}
/* sidebar */
.sb{width:16rem;flex:0 0 auto;background:var(--n50);border-right:1px solid var(--n200);display:flex;flex-direction:column}
.sbh{padding:16px;display:flex;align-items:center;gap:8px}
.logo{width:32px;height:32px;border-radius:8px;border:1px solid var(--n300);background:#fff;position:relative;flex:0 0 auto}
.logo:before,.logo:after,.ximg:before,.ximg:after{content:"";position:absolute;left:50%;top:50%;width:70%;height:1px;
 background:var(--n300);transform:translate(-50%,-50%) rotate(45deg)}
.logo:after,.ximg:after{transform:translate(-50%,-50%) rotate(-45deg)}
.sbh p{margin:0}
.sbh .t{font-size:13.5px;font-weight:600;line-height:1.2}
.sbh .s{font-size:10px;color:var(--n500);font-weight:500}
.sbg{padding:0 8px}
.sbl{font-size:11px;color:var(--n500);padding:10px 8px 6px;font-weight:500}
.nav{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:var(--r-md);font-size:13.5px;
 color:var(--n800);text-align:left}
.nav:hover{background:var(--n100)}
.nav.on{background:var(--n200);font-weight:500;color:var(--n900)}
.nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.sbf{margin-top:auto;padding:12px;display:flex;gap:10px;align-items:center}
.av{width:32px;height:32px;border-radius:99px;background:var(--n200);display:flex;align-items:center;justify-content:center;
 font-size:11px;font-weight:600;color:var(--n700)}
.sbf p{margin:0;font-size:13px;font-weight:500;line-height:1.25}
.sbf .e{font-size:11.5px;color:var(--n500);font-weight:400}
/* main */
main{flex:1;min-width:0;overflow:auto;padding:24px}
.page{max-width:1600px;margin:0 auto}
.page.narrow{max-width:56rem}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub{margin:4px 0 0;font-size:13.5px;color:var(--n500)}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.srch{position:relative;width:288px}
.srch input{width:100%;height:32px;border:1px solid var(--n200);border-radius:var(--r-lg);background:#fff;padding:0 10px 0 30px;
 font-size:12px;font-family:inherit;color:var(--n900)}
.srch input:focus{outline:none;border-color:var(--n500)}
.srch svg{position:absolute;left:10px;top:9px;width:14px;height:14px;stroke:var(--n500);fill:none;stroke-width:2}
.fb{height:32px;border:1px solid var(--n200);border-radius:var(--r-lg);background:#fff;display:inline-flex;align-items:center;
 gap:8px;padding:0 12px;font-size:12px;color:var(--n500)}
.fb.on{border-color:var(--n900);color:var(--n900);background:var(--n100)}
.seg{display:inline-flex;height:32px;border:1px solid var(--n200);border-radius:var(--r-lg);background:#fff;overflow:hidden}
.seg button{padding:0 12px;font-size:12px;color:var(--n500);border-right:1px solid var(--n200)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--n900);color:#fff}
.btn{height:32px;border-radius:var(--r-lg);padding:0 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;
 gap:6px;background:var(--n900);color:#fff;border:1px solid var(--n900);white-space:nowrap}
.btn.o{background:#fff;color:var(--n900);border-color:var(--n300)}
.btn.o:hover{background:var(--n100)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.lg{height:36px;padding:0 16px;font-size:14px;gap:8px}
.btn.lg svg{width:16px;height:16px}
.btn.ghost{background:none;border-color:transparent;color:var(--n500);padding:0 8px}
.btn.ghost:hover{color:var(--n900);background:var(--n100)}
.card{background:#fff;border:1px solid var(--n200);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--n500);padding:10px 16px;background:hsl(0 0% 96%);
 border-bottom:1px solid var(--n200);white-space:nowrap}
td{padding:8px 16px;border-bottom:1px solid var(--n200);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.act{cursor:pointer}
tbody tr.act:hover{background:hsl(0 0% 96%)}
.vn{display:flex;align-items:center;gap:8px;min-width:160px;font-weight:500}
.ximg{width:32px;height:32px;border-radius:999px;border:1px solid var(--n300);background:var(--n100);position:relative;flex:0 0 auto}
.ximg.lg{width:64px;height:64px}
.ximg.sm{width:24px;height:24px}
.ximg:before,.ximg:after{display:none}
.dot{display:inline-flex;align-items:center;gap:8px;font-size:12px}
.dot i{width:8px;height:8px;border-radius:99px;background:var(--n800);display:inline-block}
.dot i.off{background:var(--n300)}
.badge{display:inline-flex;align-items:center;border:1px solid var(--n300);border-radius:99px;padding:1px 9px;font-size:12px;
 font-weight:500;background:#fff;white-space:nowrap;line-height:1.5}
.badge.sec{background:var(--n100);border-color:var(--n100);color:var(--n500);font-weight:400}
.badge.solid{background:var(--n900);border-color:var(--n900);color:#fff}
.badge.hi{border-color:var(--n900)}
.badge.lo{color:var(--n500);border-color:var(--n300);border-style:dashed}
.badge.xs{font-size:11px;padding:0 7px}
.mut{color:var(--n500)}.dim{color:var(--n400)}.xs{font-size:12px}.nw{white-space:nowrap}.right{text-align:right}
.chv{color:var(--n400);font-size:16px;line-height:1}
/* vendor detail */
.back{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 8px;margin:-12px 0 0 -8px;border-radius:var(--r-lg);
 color:var(--n500);font-size:13px}
.back:hover{background:var(--n100);color:var(--n900)}
.prof{display:flex;align-items:flex-start;gap:20px;padding:24px}
.prof h1{font-size:30px;letter-spacing:-.02em}
.prof .line{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.prof .meta{margin:4px 0 0;font-size:13.5px;color:var(--n500)}
.prof .use{margin:8px 0 0;max-width:65ch;font-size:13.5px;line-height:1.6}
.glance{display:flex;gap:40px;padding:12px 24px;border-top:1px solid var(--n200);background:hsl(0 0% 98%)}
.gl b{display:block;font-size:18px;font-weight:600;line-height:1.2}
.gl span{font-size:12px;color:var(--n500)}
.mon{margin-top:12px;display:flex;align-items:flex-start;gap:10px;padding:10px 14px;font-size:12.5px;color:var(--n500);
 border:1px solid var(--n200);border-radius:var(--r-lg);background:#fff}
.mon .pulse{width:8px;height:8px;border-radius:99px;background:var(--n700);margin-top:6px;flex:0 0 auto}
.mon b{color:var(--n700);font-weight:500}
.tabs{display:inline-flex;height:40px;align-items:center;border-radius:var(--r-lg);background:var(--n100);padding:4px;margin:24px 0 8px}
.tabs button{height:32px;padding:0 12px;border-radius:var(--r-md);font-size:13.5px;font-weight:500;color:var(--n500);
 display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:#fff;color:var(--n900);box-shadow:var(--sh)}
.tabs .c{font-size:11.5px;color:var(--n500);font-weight:400}
.secttl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 10px}
.secttl h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.flow{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.flow i{width:8px;height:8px;border-radius:99px;background:var(--n900);display:inline-block}
.flow.no{color:var(--n500)}
.flow.no i{background:none;border:1.5px dashed var(--n400)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.6);display:none;z-index:50}
.scrim.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:75vw;background:#fff;border-left:1px solid var(--n200);
 box-shadow:-8px 0 30px rgb(0 0 0/.12);z-index:60;transform:translateX(100%);transition:transform .25s ease;padding:24px;overflow:auto}
.sheet.on{transform:none}
.sheet h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.sheet .x{position:absolute;right:16px;top:14px;width:28px;height:28px;border-radius:var(--r-md);color:var(--n500);font-size:18px}
.sheet .x:hover{background:var(--n100)}
.kv{margin-top:18px}
.kv dt{font-size:11.5px;color:var(--n500);font-weight:500;margin-bottom:4px}
.kv dd{margin:0 0 16px;font-size:13.5px}
.kv ul{margin:0;padding-left:0;list-style:none}
.kv li{padding:6px 0;border-bottom:1px solid var(--n200);font-size:13.5px;display:flex;justify-content:space-between;gap:10px}
.kv li:last-child{border-bottom:0}
.kv li span{color:var(--n500);font-size:12px}
.note{font-size:12.5px;color:var(--n500);border-left:2px solid var(--n300);padding-left:10px;margin-top:6px}
/* monitoring */
.views{display:flex;gap:20px;border-bottom:1px solid var(--n200);margin:18px 0 14px}
.views button{padding:0 2px 10px;font-size:13.5px;color:var(--n500);border-bottom:2px solid transparent;margin-bottom:-1px}
.views button.on{color:var(--n900);border-color:var(--n900);font-weight:500}
.views .c{font-size:11.5px;color:var(--n500);margin-left:4px}
.thr{display:flex;gap:14px;padding:13px 16px;border-bottom:1px solid var(--n200);cursor:pointer}
.thr:last-child{border-bottom:0}
.thr:hover{background:hsl(0 0% 97%)}
.thr .d{flex:0 0 76px;font-size:12.5px;color:var(--n500);padding-top:1px;white-space:nowrap}
.thr .b{flex:1;min-width:0}
.thr .s{font-weight:600;font-size:13.5px}
.thr .m{margin-top:3px;font-size:12.5px;color:var(--n500);display:flex;flex-wrap:wrap;gap:0 6px}
.thr .m span:not(:last-child):after{content:"·";margin-left:6px;color:var(--n400)}
.thr .why{margin-top:6px;font-size:13px;color:var(--n700);max-width:100ch}
.thr .t{flex:0 0 auto;align-self:flex-start;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.emptyq{padding:40px 20px;text-align:center;color:var(--n500);font-size:13px}
.foot{margin-top:14px;font-size:11.5px;color:var(--n400)}
/* incident detail */
.chain{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.chain .n{border:1px solid var(--n300);border-radius:var(--r-lg);padding:4px 10px;background:#fff;font-weight:500}
.chain .n.you{background:var(--n900);color:#fff;border-color:var(--n900)}
.chain .a{color:var(--n400)}
.stepper{display:inline-flex;border:1px solid var(--n200);border-radius:var(--r-lg);background:#fff;overflow:hidden;margin:18px 0 16px}
.stepper button{padding:8px 16px;font-size:13px;color:var(--n500);border-right:1px solid var(--n200);text-align:left;line-height:1.3}
.stepper button:last-child{border-right:0}
.stepper button b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--n400);font-weight:600}
.stepper button.on{background:var(--n900);color:#fff}
.stepper button.on b{color:var(--n300)}
.msg{padding:20px 22px;border-bottom:1px solid var(--n200)}
.msg:last-child{border-bottom:0}
.msg .mh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.msg .mh b{font-size:14px;font-weight:600}
.msg .src{font-size:12.5px;color:var(--n500);font-style:italic}
.msg blockquote{margin:12px 0;padding:12px 16px;border-left:3px solid var(--n300);background:hsl(0 0% 98%);font-size:13.5px;line-height:1.6}
.msg .fic{font-size:12px;color:var(--n400);font-style:italic;margin:-6px 0 12px}
.msg h4{margin:16px 0 4px;font-size:13px;font-weight:600}
.msg p{margin:0 0 6px;font-size:13.5px;line-height:1.6;max-width:80ch}
.msg .path{font-size:13px;color:var(--n700);font-weight:500}
/* map */
.mapcard{position:relative;overflow:visible}
svg.map{display:block;width:100%;height:auto;max-height:calc(100vh - 200px);margin:0 auto;user-select:none}
.map text{font-family:var(--sans);fill:var(--n700);font-size:11px}
.map .vnode{cursor:pointer}
.map .vnode circle{fill:#fff;stroke:var(--n600);stroke-width:1.2}
.map .vnode:hover circle{stroke:var(--n900);stroke-width:2}
.map .vnode.open circle{fill:var(--n900);stroke:var(--n900)}
.map .vnode.shares circle{stroke-dasharray:2 2}
.map .vnode.open text{fill:var(--n900);font-weight:600}
.map .spoke{stroke:var(--n300);stroke-width:1}
.map .spoke.open{stroke:var(--n900);stroke-width:1.5}
.map .fp circle{fill:#fff;stroke:var(--n500);stroke-width:1}
.map .fp.data circle{fill:var(--n700);stroke:var(--n700)}
.map .fp text{font-size:10.5px}
.map .fl{stroke:var(--n500);stroke-width:1}
.map .fl.no{stroke-dasharray:3 3;stroke:var(--n400)}
.map .share{stroke:var(--n400);stroke-width:1;stroke-dasharray:2 3}
.map .share.hov{display:none}
.map .share.lit{display:block;stroke:var(--n800);stroke-width:1.2}
.map .fp:hover circle{stroke:var(--n900);stroke-width:2}
.map .hub circle{fill:var(--n900)}
.map .hub text{fill:#fff;font-weight:600;font-size:12px}
.legend{width:230px;flex:0 0 auto;font-size:12.5px;color:var(--n600)}
.legend .li{display:flex;gap:8px;align-items:center;padding:6px 0}
.legend i{width:10px;height:10px;border-radius:99px;display:inline-block;border:1px solid var(--n600);background:#fff}
.legend i.f{background:var(--n700);border-color:var(--n700)}
.legend i.d{border-style:dashed;border-color:var(--n400)}
.legend hr{border:0;border-top:1px solid var(--n200);margin:8px 0}
.thr .ln{margin-top:5px;font-size:12.5px;color:var(--n700);display:flex;gap:6px;flex-wrap:wrap;line-height:1.45}
.thr .ln b{color:var(--n500);font-weight:500;flex:0 0 190px}
.thr .ln .pth{color:var(--n900);font-weight:500}
.sheet.wide{width:640px}
.sheet .stepper{margin:14px 0 12px}
.sheet .msg{padding:16px 0;border-bottom:1px solid var(--n200)}
.sheet .msg:last-child{border-bottom:0}
.thr{flex-direction:column;gap:0;padding:16px 18px}
.thr .top{display:flex;gap:14px;align-items:flex-start}
.thr .top .b{flex:1}
.chainv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 10px 90px}
.node{display:inline-flex;flex-direction:column;border:1px solid var(--n300);border-radius:var(--r-lg);padding:5px 11px;background:#fff;min-width:120px}
.node .nm{font-weight:600;font-size:12.5px;line-height:1.3}
.node .rl{font-size:11px;color:var(--n500);line-height:1.3}
.node.you{background:var(--n100);border-color:var(--n200)}
.node.hit{border:1.5px solid var(--n900)}
.node.off{border-style:dashed;color:var(--n500)}
.node.off .nm{color:var(--n600)}
.arr{display:inline-flex;align-items:center;color:var(--n500)}
.arr svg{width:34px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5}
.arr.off{color:var(--n400)}
.arr.off svg{stroke-dasharray:3 3}
.arr .lbl{font-size:10.5px;color:var(--n400);margin-left:4px}
.nocon{font-size:12px;color:var(--n500);display:inline-flex;align-items:center;gap:8px}
.nocon i{width:28px;border-top:1px dashed var(--n300);display:inline-block}
.thr .body{margin:0 0 0 90px;font-size:13.5px;line-height:1.55;color:var(--n800);max-width:96ch}
.thr .srcline{margin-top:10px;display:flex;justify-content:flex-end}
.thr .srcline span{font-size:11.5px;color:var(--n500);border:1px solid var(--n200);border-radius:var(--r-md);padding:2px 8px;background:hsl(0 0% 98%);display:inline-flex;gap:6px;align-items:center}
.thr .srcline svg{width:11px;height:11px;stroke:var(--n500);fill:none;stroke-width:1.8}

/* B5 rail: one continuous arrow, identical stops, last stop filled */
.thr .two{display:flex;gap:28px;margin:12px 0 0 90px;align-items:flex-start}
.rail{flex:0 0 250px;padding-left:20px}
.rail .st{position:relative;padding-bottom:14px}
.rail .st:last-child{padding-bottom:0}
.rail .st:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:99px;border:1.5px solid var(--n900);background:#fff;z-index:1}
.rail .st:not(:last-child):after{content:"";position:absolute;left:-14px;top:15px;bottom:-6px;width:1px;background:var(--n900)}
.rail .st:nth-last-child(2):after{bottom:0}
.rail .st:nth-last-child(2) .n:after{content:"";position:absolute;left:-17.5px;bottom:-4px;border:4px solid transparent;border-top:7px solid var(--n900);border-bottom:0}
.rail .st:last-child:before{background:var(--n900)}
.rail .st.off:before{background:#fff;border-style:dashed;border-color:var(--n500)}
.rail .st.off .n{color:var(--n600)}
.rail .st:nth-last-child(2).todash:after{background:none;border-left:1px dashed var(--n500)}
.rail .st:nth-last-child(2).todash .n:after{border-top-color:var(--n500)}
.rail .n{font-weight:600;font-size:13px;line-height:1.3}
.rail .st:last-child .n{font-weight:700}
.rail .r{font-size:11.5px;color:var(--n500);line-height:1.35}
.thr .two .body{margin:0}

/* TEMP layout switcher + L1..L5 row structures (delete before sessions if not needed) */
.lsw{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:11.5px;color:var(--n500)}
.lsw .seg button{padding:0 10px}
.thr.L{display:block;padding:0}
.thr.L .in{padding:16px 18px}
.thr.L .sub{font-weight:600;font-size:14px;line-height:1.35}
.thr.L .meta{font-size:12px;color:var(--n500);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.thr.L .meta span+span:before{content:"\00b7";margin-right:6px;color:var(--n400)}
.thr.L .p{margin:0;font-size:13.5px;line-height:1.55;max-width:72ch;color:var(--n800)}
.thr.L .rail{flex:none}
.thr.L .srcl{font-size:11.5px;color:var(--n500);border:1px solid var(--n200);border-radius:var(--r-md);padding:2px 8px;background:hsl(0 0% 98%);display:inline-flex;gap:6px;align-items:center}
.thr.L .srcl svg{width:11px;height:11px;stroke:var(--n500);fill:none;stroke-width:1.8}
.thr.L .tg{font-size:11px;border-radius:999px;padding:0 7px;background:var(--n100);color:var(--n500);white-space:nowrap}
.thr.L .date{font-size:12.5px;color:var(--n500);font-variant-numeric:tabular-nums}
.thr.L1 .in{display:grid;grid-template-columns:250px 1fr;gap:28px}
.thr.L1 .date{margin-bottom:14px}
.thr.L1 .meta{margin:6px 0 12px}
.thr.L1 .foot{display:flex;justify-content:flex-end;margin-top:12px}
.thr.L2 .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.thr.L2 .rail{margin:14px 0 14px 2px}
.thr.L2 .foot{display:flex;justify-content:flex-end;margin-top:12px}
.thr.L3 .in{display:grid;grid-template-columns:76px 1fr;gap:14px}
.thr.L3 .date{padding-top:2px}
.thr.L3 .rail{margin:14px 0 14px 2px}
.thr.L3 .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:10px;border-top:1px solid var(--n200);flex-wrap:wrap}
.thr.L4 .in{display:grid;grid-template-columns:1fr 260px;gap:32px}
.thr.L4 .aside{border-left:1px solid var(--n200);padding-left:24px}
.thr.L4 .aside .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--n400);font-weight:600;margin:0 0 10px}
.thr.L4 .foot{display:flex;justify-content:flex-end;margin-top:14px}
.thr.L5 .band{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;background:hsl(0 0% 96%);border-bottom:1px solid var(--n200)}
.thr.L5 .band .sub{font-size:13.5px}
.thr.L5 .in{display:grid;grid-template-columns:250px 1fr;gap:28px}
.thr.L5 .foot{padding:8px 18px;border-top:1px solid var(--n200);display:flex;justify-content:flex-end}

/* L6: header band, title row, two columns sharing one top edge, footer */
.thr.L6 .band{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 22px;background:hsl(0 0% 96%);border-bottom:1px solid var(--n200);font-size:12.5px;color:var(--n600)}
.thr.L6 .band b{font-weight:600;color:var(--n800)}
.thr.L6 .in{padding:20px 22px 18px}
.thr.L6 .ttl{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.thr.L6 .ttl .sub{font-size:17px;letter-spacing:-.01em}
.thr.L6 .meta2{margin-top:4px;font-size:13px;color:var(--n500)}
.thr.L6 .cols{display:grid;grid-template-columns:1fr 320px;gap:44px;margin-top:22px;align-items:start}
.thr.L6 .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--n500);font-weight:600;margin:0 0 10px}
.thr.L6 .p{max-width:none}
.thr.L6 .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.thr.L6 .pills span{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--n100);color:var(--n600)}
.thr.L6 .rail{margin-top:2px}
.thr.L6 .foot{margin-top:22px;display:flex;justify-content:flex-start}

/* drawer summary (L6 pieces, stacked for 640px) */
.sheet .band{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-24px -24px 18px;padding:10px 24px;background:hsl(0 0% 96%);border-bottom:1px solid var(--n200);font-size:12.5px;color:var(--n600)}
.sheet .band b{font-weight:600;color:var(--n800)}
.sheet .ttl{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-right:20px}
.sheet .ttl h2{font-size:18px}
.sheet .tg{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--n100);color:var(--n500);white-space:nowrap;margin-top:3px}
.sheet .meta2{margin-top:4px;font-size:13px;color:var(--n500)}
.sheet .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--n500);font-weight:600;margin:22px 0 10px}
.sheet .p{margin:0;font-size:13.5px;line-height:1.6;color:var(--n800)}
.sheet .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.sheet .pills span{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--n100);color:var(--n600)}
.sheet .rail{padding-left:20px}
.sheet .foot{margin-top:18px}
.sheet .srcl{font-size:11.5px;color:var(--n500);border:1px solid var(--n200);border-radius:var(--r-md);padding:2px 8px;background:hsl(0 0% 98%);display:inline-flex;gap:6px;align-items:center}
.sheet .srcl svg{width:11px;height:11px;stroke:var(--n500);fill:none;stroke-width:1.8}
.sheet hr.div{border:0;border-top:1px solid var(--n200);margin:24px -24px 4px}

/* mini chain in the monitoring table */
.mc{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mc .c{font-size:11.5px;border:1px solid var(--n300);border-radius:4px;padding:0 7px;line-height:1.6;background:#fff;color:var(--n800)}
.mc .c.you{background:var(--n100);border-color:var(--n200);color:var(--n600)}
.mc .c.end{border:1.5px solid var(--n900);font-weight:600}
.mc .c.off{border-style:dashed;color:var(--n500)}
.mc .a{color:var(--n400);font-size:12px}
.mc .a.off{color:var(--n300)}
.mc .note{font-size:11.5px;color:var(--n500);margin-left:2px}

/* inline incident card (involved view) */
.inc{background:#fff;border:1px solid var(--n200);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.inc .vis{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 22px;background:var(--n900);color:#fff;font-size:13px}
.inc .vis b{font-weight:600}
.inc .vis span{color:hsl(0 0% 72%);white-space:nowrap}
.inc .in{padding:18px 22px 16px}
.inc h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em}
.inc .because{margin:6px 0 0;font-size:13.5px;color:var(--n600);line-height:1.55;max-width:80ch}
.inc .because b{color:var(--n900);font-weight:600}
.inc .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.inc .chips span{font-size:12px;border:1px solid var(--n300);border-radius:4px;padding:1px 8px;background:#fff;color:var(--n700)}
.inc .chips span.end{border:1.5px solid var(--n900);color:var(--n900);font-weight:600}
.inc .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--n500);font-weight:600;margin:16px 0 6px}
.inc .p{margin:0;font-size:14px;line-height:1.6;color:var(--n800);max-width:82ch}
.inc .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.inc .pills span{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--n100);color:var(--n600)}
.inc .srcl{font-size:11.5px;color:var(--n500);border:1px solid var(--n200);border-radius:var(--r-md);padding:2px 8px;background:hsl(0 0% 98%);display:inline-flex;gap:6px;align-items:center;margin-top:16px}
.inc .srcl svg{width:11px;height:11px;stroke:var(--n500);fill:none;stroke-width:1.8}
.inc .upd{border-top:1px solid var(--n200);padding:18px 22px 6px;background:hsl(0 0% 98.5%)}
.inc .upd .lab{margin-top:0}
.inc .stepper{margin:6px 0 10px;background:#fff}
.inc .msg{padding:18px 0;border-bottom:1px solid var(--n200)}
.inc .msg:last-child{border-bottom:0}

.inc .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.inc .when{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--n500);white-space:nowrap;padding-top:3px}
.inc .srcico{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border:1px solid var(--n200);border-radius:var(--r-md);color:var(--n600);background:#fff}
.inc .srcico:hover{background:var(--n100);color:var(--n900)}
.inc .srcico svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* push panel: sits beside main, no scrim, content reflows */
.panel{display:none;width:560px;flex:0 0 auto;border-left:1px solid var(--n200);background:#fff;overflow:auto;padding:20px 24px 40px}
.panel.on{display:block}
.panel .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.panel .ph h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.panel .ph .sub{margin:2px 0 0}
.panel .x{width:28px;height:28px;border-radius:var(--r-md);color:var(--n500);font-size:18px;flex:0 0 auto}
.panel .x:hover{background:var(--n100)}
.panel .stepper{margin:14px 0 6px}
.panel .msg{padding:18px 0;border-bottom:1px solid var(--n200)}
.panel .msg:last-child{border-bottom:0}
.inc .updrow{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--n200);padding:12px 22px;background:hsl(0 0% 98.5%);font-size:13px;color:var(--n600)}
.inc .updrow b{color:var(--n900);font-weight:600}

.inc .crumb{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:13px;color:var(--n700);flex-wrap:wrap}
.inc .crumb span{display:inline-flex;align-items:baseline;gap:5px}
.inc .crumb span.end{font-weight:600;color:var(--n900)}
.inc .crumb small{font-size:11px;color:var(--n500);font-weight:400}
.inc .crumb i{color:var(--n400);font-style:normal;font-size:14px}

/* checked but not involving you: quiet, collapsed */
.chk{margin-top:28px;border:1px solid var(--n200);border-radius:var(--r-lg);background:hsl(0 0% 98.5%)}
.chkh{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;text-align:left;font-size:13px;color:var(--n600)}
.chkh b{color:var(--n800);font-weight:600}
.chkh svg{width:14px;height:14px;stroke:var(--n500);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.chkh .cv{margin-left:auto;color:var(--n400);font-size:16px;transition:transform .12s;font-style:normal}
.chk.open .chkh .cv{transform:rotate(90deg)}
.chkb{border-top:1px solid var(--n200);background:#fff;border-radius:0 0 var(--r-lg) var(--r-lg);overflow:hidden}

.frow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--n500);white-space:nowrap;padding-top:8px}
.status svg{width:13px;height:13px;stroke:var(--n500);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.status .sep{color:var(--n300)}
.status .tip{left:auto;right:0}
.status .tt a{color:var(--n800)}
.ckline{margin:18px 0 0;font-size:13px;color:var(--n500)}
.ckline a{color:var(--n900);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.plain{margin-top:10px}
.plain .li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--n200);font-size:13px;cursor:pointer}
.plain .li:last-child{border-bottom:0}
.plain .li:hover .s{text-decoration:underline;text-underline-offset:3px}
.plain .li .s{font-weight:500}
.plain .li .w{color:var(--n500);font-size:12px;margin-top:1px}
.plain .li .d{color:var(--n500);white-space:nowrap;font-size:12px;padding-top:1px}

/* unified alert cards */
.alist{display:flex;flex-direction:column;gap:10px}
.al{background:#fff;border:1px solid var(--n200);border-radius:var(--r-lg);box-shadow:var(--sh);padding:14px 18px 14px;cursor:pointer}
.al:hover{border-color:var(--n400)}
.al.sel{border-color:var(--n900)}
.al .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.al h2{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.al .when{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--n500);white-space:nowrap;padding-top:1px}
.al .srcico{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border:1px solid var(--n200);border-radius:var(--r-md);color:var(--n600);background:#fff}
.al .srcico:hover{background:var(--n100);color:var(--n900)}
.al .srcico svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.al .crumb{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12.5px;color:var(--n600);flex-wrap:wrap}
.al .crumb span{display:inline-flex;align-items:baseline;gap:5px}
.al .crumb span.end{font-weight:600;color:var(--n900)}
.al .crumb span.off{color:var(--n500)}
.al .crumb small{font-size:11px;color:var(--n500);font-weight:400}
.al .crumb i{color:var(--n400);font-style:normal;font-size:14px}
.al .line{margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--n800);max-width:100ch}
.panel{width:460px;padding:18px 22px 40px}
.panel .ph h3{font-size:15.5px;padding-right:8px}
.panel .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--n500);font-weight:600;margin:14px 0 6px}
.panel .p{margin:0;font-size:13.5px;line-height:1.6;color:var(--n800)}
.panel .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.panel .pills span{font-size:12px;border-radius:999px;padding:1px 9px;background:var(--n100);color:var(--n600)}
.panel .srcline{margin:12px 0 0;font-size:12px;color:var(--n500)}
.panel .srcline a{color:var(--n700);text-decoration:underline;text-underline-offset:3px}
.panel .srcline a:hover{color:var(--n900)}
.panel .stepper{margin:6px 0 8px}

.banner .bi{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.views button{display:inline-flex;align-items:center;gap:6px}
.views .ti{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* thread in the panel */
.al .when .sep{color:var(--n300)}
.al .when b{color:var(--n900);font-weight:600}
.al .thr-n{display:inline-flex;align-items:center;gap:5px}
.al .thr-n svg{width:13px;height:13px;stroke:var(--n500);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel .thr-note{margin:0 0 10px;font-size:12.5px;color:var(--n500)}
.thread{border:1px solid var(--n200);border-radius:var(--r-lg);overflow:hidden;background:#fff}
.tm{border-bottom:1px solid var(--n200)}
.tm:last-child{border-bottom:0}
.tmh{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;font-size:13px}
.tmh:hover{background:hsl(0 0% 97%)}
.tm.open .tmh{background:hsl(0 0% 97.5%)}
.tmd{flex:0 0 66px;color:var(--n500);font-size:12.5px;font-variant-numeric:tabular-nums}
.tml b{font-weight:600}
.tmh .cv{margin-left:auto;color:var(--n400);font-size:16px;transition:transform .12s;font-style:normal}
.tm.open .tmh .cv{transform:rotate(90deg)}
.tmb{padding:4px 14px 16px}
.tmb .src{font-size:12px}
.tmb h4{margin:14px 0 4px;font-size:13px;font-weight:600}
.tmb p{margin:0 0 6px;font-size:13px;line-height:1.6}
.tmb blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid var(--n300);background:hsl(0 0% 98%);font-size:13px;line-height:1.6}
.tmb .fic{font-size:12px;color:var(--n400);font-style:italic;margin:-4px 0 10px}
.tmb .path{font-size:13px;color:var(--n700);font-weight:500}

/* unread */
.vchips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vchip{font-size:11.5px;border:1px solid var(--n200);border-radius:4px;padding:1px 9px;line-height:1.6;background:var(--n100);color:var(--n800);white-space:nowrap}
.vchip.off{background:#fff;border-color:var(--n200);color:var(--n400)}
.vmore{font-size:11.5px;color:var(--n500);align-self:center;padding-left:2px}

.sh{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--n500);border-radius:4px}
.sh:hover,.sh.on{color:var(--n900)}
.sh svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.7}

/* expanded subprocessor row */
tr.open td{border-bottom:0;background:hsl(0 0% 97%)}
tr.xrow td{padding:0 16px 16px 60px;background:hsl(0 0% 97%);border-bottom:1px solid var(--n200)}
.sx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px;padding:16px 18px;background:#fff;border:1px solid var(--n200);border-radius:var(--r-lg)}
.sxn{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--n500);font-weight:600}
.sxn .mut{font-weight:400;font-size:13px}
.sxd{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--n700);max-width:60ch}
.sxf{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:14px 0 0}
.sxf div{min-width:0}
.sxf dt{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--n500);font-weight:600}
.sxf dd{margin:2px 0 0;font-size:13px;color:var(--n800)}
.sxh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--n500);font-weight:600;margin-bottom:8px}
.sxh .lg{text-transform:none;letter-spacing:0;font-weight:400;font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.sxh .lg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-left:6px}
.sxp{margin-bottom:10px}
.sxv{font-size:12.5px;color:var(--n600);margin-bottom:5px}
.sxp.off .sxv{color:var(--n400)}
.dcs{display:flex;flex-wrap:wrap;gap:6px}
.dc{display:inline-flex;align-items:center;gap:7px;font-size:12px;border:1px solid var(--n200);border-radius:4px;padding:2px 9px;background:#fff;color:var(--n800)}
.dc i,.lg i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:0 0 auto}
i.high{background:var(--n900)}
i.medium{background:var(--n500)}
i.low{background:var(--n300)}

/* expand control, first column */
td.xc,th.xc{width:44px;padding-right:0}
.xbtn{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;color:var(--n500)}
tr.act:hover .xbtn{color:var(--n900)}
.xbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s}
.xbtn.open{color:var(--n900)}
.xbtn.open svg{transform:rotate(90deg)}

/* vendor profile header, matching the app */
.prof{align-items:flex-start}
.prof .meta{margin-top:4px}
.prof .usedfor{margin:10px 0 0;font-size:13.5px;color:var(--n600)}
.prof .usedfor b{color:var(--n900);font-weight:600;margin-right:6px}
.prof .links{display:flex;gap:18px;margin-top:10px;font-size:13.5px}
.prof .links a{display:inline-flex;align-items:center;gap:6px;color:var(--n700);text-decoration:none;cursor:pointer}
.prof .links a:hover{color:var(--n900);text-decoration:underline;text-underline-offset:3px}
.prof .links svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.prof .acts{display:flex;gap:10px;flex:0 0 auto}
.glance{gap:0;padding:14px 24px;border-radius:0 0 var(--r-lg) var(--r-lg)}
.glance .gl{flex:1}
.glance .gl span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--n500);font-weight:500;margin-bottom:4px}
.glance .gl b{font-size:15px;font-weight:500}
.glance .gl b.dotb{display:inline-flex;align-items:center;gap:8px}
.glance .gl b.dotb i{width:8px;height:8px;border-radius:99px;background:var(--n800);display:inline-block}
.glance .gl b.dotb i.off{background:var(--n300)}
.glance .gl b small{color:var(--n500);font-size:12px}
.vtabs{margin:22px 0 14px;gap:26px}
.vtabs button{font-size:14px;padding-bottom:10px}

/* monitoring line + sources tooltip */
.prof .src{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12.5px;color:var(--n500)}
.prof .src svg{width:13px;height:13px;stroke:var(--n500);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tt{position:relative;display:inline-block;padding-bottom:10px;margin-bottom:-10px}
.tt.open .tip{display:block}
.tt a{color:var(--n800);text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted;cursor:default}
.tip{display:none;position:absolute;left:0;top:100%;z-index:20;width:360px;background:#fff;border:1px solid var(--n200);border-radius:8px;box-shadow:0 8px 26px rgb(0 0 0/.12);padding:10px 14px 6px;font-size:12.5px;color:var(--n800)}

 if(t.special){
  const label={0:'First advisory',3:'Update',6:'Update',13:'Update'}, from={0:'Salesloft trust center',3:'Cloudflare, through Conveyor',6:'Cloudflare, through Conveyor',13:'Cloudflare security blog'};
  const msgs=SL.msgs.filter(m=>m.day<=state.day).reverse();
  html+=`<p class="lab" style="margin-top:22px">Thread</p><div class="thread">`+msgs.map(m=>{
   const open=!!state.openMsgs[m.day];
   const keep=sec=>!/^Where this stands|^What is not known/.test(sec[0]);
   return `<div class="tm ${open?'open':''}"><button class="tmh" onclick="state.openMsgs[${m.day}]=!state.openMsgs[${m.day}];render()">
     <span class="tmd">${fmt(ROW.salesloft[m.day].date)}</span><span class="tml"><b>${label[m.day]}</b> <span class="mut">from ${from[m.day]}</span></span><i class="cv">&#8250;</i></button>
     ${open?`<div class="tmb"><blockquote style="margin-top:10px">${esc(m.quote)}</blockquote>
      ${m.sections.filter(keep).map(s=>`<h4>${esc(s[0])}</h4>${s[1].map(p=>`<p>${esc(p)}</p>`).join('')}${s[2]?`<p class="path">${esc(s[2])}</p>`:''}`).join('')}</div>`:''}
    </div>`}).join('')+`</div>`;
 } else {
  html+=`<p class="lab" style="margin-top:22px">Details</p><div class="msg" style="padding-top:0"><blockquote style="margin-top:4px">${esc(t.said)}</blockquote>
   ${(t.sec||[]).filter(sec=>!/^Where this stands|^What is not known/.test(sec[0])).map(s=>`<h4>${esc(s[0])}</h4>${s[1].map(p=>`<p>${esc(p)}</p>`).join('')}${s[2]?`<p class="path">${esc(s[2])}</p>`:''}`).join('')}</div>`;
 }
 el.innerHTML=html; el.classList.add('on');
}
function alertCard(t){
 const r=rowOf(t); const date=fmt(t.special?r.date:t.sort); const source=t.involved?r.source:shortSrc(t);
 const via=t.via&&t.via[0];
 const href = t.special ? (state.day===0 ? 'https://trust.salesloft.com/?uid=Drift+Security+Update' : state.day===13 ? 'https://blog.cloudflare.com/response-to-salesloft-drift-incident/' : '#') : '#';
 const crumb = t.depth==='outside' ? `<span>Your data</span><i>&rsaquo;</i><span>Your vendors</span><i>&rsaquo;</i><span class="off">${esc(t.about)} <small>(not connected)</small></span>`

 return `<div class="al ${state.panel===t.id?'sel':''} ${state.unread[t.id]?'unread':''}" id="inc-${t.id}" onclick="state.panel='${t.id}';render()">
  <div class="band"><h2>${t.involved&&!t.other?'<svg class="warn" viewBox="0 0 24 24" aria-label="Risk advisory"><path d="M10.3 3.9 2.4 17.5A1.9 1.9 0 0 0 4 20.4h16a1.9 1.9 0 0 0 1.6-2.9L13.7 3.9a1.9 1.9 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>':''}${esc(t.subject)}</h2><div class="when">${t.special
    ?(()=>{const n=SL.msgs.filter(m=>m.day<=state.day).length;return `<span>${fmt(ROW.salesloft[state.day].date)}</span><span class="sep">&middot;</span><span class="thr-n"><svg viewBox="0 0 24 24"><path d="M9 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M15 14l3 3-3 3"/><path d="M11 17h7"/></svg>${n>1?`${n} in thread${state.unread[t.id]?', <b>1 new</b>':''}`:(state.unread[t.id]?'<b>New advisory</b>':'First advisory')}</span>`})()
    :`<span>Disclosed ${date}</span>`}<a class="srcico" href="${href}" target="_blank" rel="noopener" title="Source: ${esc(source)}" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></a></div></div>
  <div class="body"><div class="crumb">${crumb}</div><p class="line">${esc(lineOf(t))}</p></div>
 </div>`;

function whyNot(t){
 if(t.depth==='outside') return t.about+' is not one of your vendors and is not a subprocessor of any of them.';
 if(t.depth==='vendor') return t.about+' is your vendor. The system named is not the one your data is in.';
 return t.about+' is a subprocessor of '+t.via.join(' and ')+'. No customer data of yours goes down that path.';
}

/* ---------- screen 5: supply chain map ---------- */
function hl(i,on){document.querySelectorAll('.sh-'+i).forEach(l=>l.classList.toggle('lit',!!on))}
function rMap(){
 const open=state.mapOpen?byId[state.mapOpen]:null;
 return `<div class="page">
  <button class="back" onclick="go('vendors')">&#8592; Vendor portfolio</button>
  <div class="hd" style="margin-top:12px"><div><h1>Supply chain map</h1><p class="sub">${open?`${esc(open.name)}: ${open.fps.length} subprocessors, ${open.fps.filter(f=>f.data).length} receive your customer data. Filled dots receive your data, hollow ones do not. Dotted lines show which of your other vendors share a subprocessor.`:`${VENDORS.length} vendors. Click a vendor to see its subprocessors.`}</p></div>
   <div style="display:flex;gap:8px;flex:0 0 auto">${open?`<button class="btn o" onclick="openVendor('${open.id}')">Open ${esc(open.name)}</button><button class="btn o" onclick="state.mapOpen=null;render()">Collapse</button>`:''}</div></div>
  <div class="card mapcard"><svg class="map" id="mapsvg" viewBox="0 0 1600 1200"></svg>
   <div class="zoomctl"><button title="Zoom in" onclick="zoomBy(1.25)">+</button><button title="Zoom out" onclick="zoomBy(0.8)">&minus;</button><button title="Reset view" onclick="zoomReset()">&#8634;</button></div>
   <div class="zoomhint">Scroll to zoom, drag to move</div></div>
 </div>`;
}
function drawMap(){
 const svg=$('mapsvg'); const W=1600,H=1200,cx=W/2,cy=H/2,R=330,R2=470;
 const vs=[...VENDORS].sort((a,b)=>a.name.localeCompare(b.name));
 const pos={}; vs.forEach((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/vs.length;pos[v.id]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),a}});
 const open=state.mapOpen?byId[state.mapOpen]:null;
 let out='';
 // spokes hub → vendor
 vs.forEach(v=>{const p=pos[v.id];out+=`<line class="spoke ${open&&open.id===v.id?'open':''}" x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}"/>`});
 let fpNodes='';
 if(open){
  const p=pos[open.id]; const n=open.fps.length; const spread=Math.min(Math.PI*1.1, 0.075*n+0.4);
  const start=p.a-spread/2;
  open.fps.forEach((f,i)=>{
   const a=start+(n===1?spread/2:i*spread/(n-1)); const r=R2+((i%2)?70:0)+ (n>30?((i%3)*22):0);
   const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
   const sharers=VENDORS.filter(o=>o.id!==open.id&&o.fps.some(g=>g.n===f.n));
   sharers.forEach(o=>{const q=pos[o.id];out+=`<line class="share sh-${i} ${sharers.length>5?'hov':''}" x1="${x}" y1="${y}" x2="${q.x}" y2="${q.y}"/>`});
   out+=`<line class="fl ${f.data?'':'no'}" x1="${p.x}" y1="${p.y}" x2="${x}" y2="${y}"/>`;
   const right=Math.cos(a)>=0;
   fpNodes+=`<g class="fp ${f.data?'data':''}" style="cursor:pointer" onclick="openFp('${open.id}','${esc(f.n)}')" onmouseenter="hl(${i},1)" onmouseleave="hl(${i},0)"><circle cx="${x}" cy="${y}" r="5"/><text x="${x+(right?9:-9)}" y="${y+3.5}" text-anchor="${right?'start':'end'}">${esc(f.n)}</text></g>`;
  });
 }
 // vendor nodes
 vs.forEach(v=>{const p=pos[v.id];const isOpen=open&&open.id===v.id;const shares=open&&!isOpen&&v.fps.some(g=>open.fps.some(f=>f.n===g.n));
  const right=Math.cos(p.a)>=0; const lx=cx+(R+14)*Math.cos(p.a), ly=cy+(R+14)*Math.sin(p.a);
  const hideLabel=open&&!isOpen&&!shares; // quiet the ring while one vendor is open
  out+=`<g class="vnode ${isOpen?'open':''} ${shares?'shares':''}" onclick="state.mapOpen=${isOpen?'null':`'${v.id}'`};render()"><circle cx="${p.x}" cy="${p.y}" r="${isOpen?9:6}"/>${hideLabel?'':`<text x="${lx}" y="${ly+3.5}" text-anchor="${right?'start':'end'}" transform="rotate(${(p.a*180/Math.PI)+(right?0:180)} ${lx} ${ly})" style="${shares?'fill:var(--n900)':''}">${esc(v.name)}</text>`}</g>`;
 });
 out+=fpNodes;
 out+=`<g class="hub"><circle cx="${cx}" cy="${cy}" r="46"/><text x="${cx}" y="${cy+4}" text-anchor="middle">Your company</text></g>`;
 const z=state.zoom; svg.innerHTML=`<g id="vp" transform="translate(${z.x} ${z.y}) scale(${z.k})">${out}</g>`;
 wireZoom(svg);
}
function applyZoom(){const g=document.getElementById('vp'); if(g){const z=state.zoom; g.setAttribute('transform',`translate(${z.x} ${z.y}) scale(${z.k})`)}}
function zoomBy(f,cx=800,cy=600){const z=state.zoom; const k=Math.min(6,Math.max(0.5,z.k*f)); const r=k/z.k; z.x=cx-(cx-z.x)*r; z.y=cy-(cy-z.y)*r; z.k=k; applyZoom()}
function zoomReset(){state.zoom={k:1,x:0,y:0}; applyZoom()}
function svgPoint(svg,e){const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse())}
function wireZoom(svg){
 if(svg.dataset.wired)return; svg.dataset.wired='1';
 svg.addEventListener('wheel',e=>{e.preventDefault(); const p=svgPoint(svg,e); zoomBy(e.deltaY<0?1.1:0.9,p.x,p.y)},{passive:false});
 let drag=null;
 svg.addEventListener('pointerdown',e=>{if(e.target.closest('.vnode,.fp'))return; drag={x:e.clientX,y:e.clientY,zx:state.zoom.x,zy:state.zoom.y}; svg.classList.add('dragging'); svg.setPointerCapture(e.pointerId)});
 svg.addEventListener('pointermove',e=>{if(!drag)return; const ctm=svg.getScreenCTM(); state.zoom.x=drag.zx+(e.clientX-drag.x)/ctm.a; state.zoom.y=drag.zy+(e.clientY-drag.y)/ctm.d; applyZoom()});
 const end=()=>{drag=null; svg.classList.remove('dragging')};
 svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
}
